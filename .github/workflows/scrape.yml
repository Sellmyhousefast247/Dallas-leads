name: Daily Scrape

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          sudo apt-get install -y -q tesseract-ocr
          pip install requests beautifulsoup4 lxml playwright pytesseract pillow
          python -m playwright install --with-deps chromium

      - name: Restore DCAD bulk lookup (weekly cache)
        uses: actions/cache@v4
        with:
          path: |
            data/dcad_lookup.csv.gz
            data/dcad_lookup.meta.json
          key: dcad-lookup-v1-${{ github.run_id }}
          restore-keys: dcad-lookup-v1-

      - name: DCAD bulk sync (full-county property roll)
        run: python scraper/dcad_bulk.py   # skips download while lookup is < 6 days old
        continue-on-error: true
        timeout-minutes: 20

      - name: Run pipeline
        run: python scraper/fetch.py
        timeout-minutes: 40
        env:
          LOOKBACK_DAYS: "7"

      - name: Trustee deeds (surplus funds feed)
        run: python scraper/trustee_deeds.py
        if: always()              # runs even when the main pipeline step fails/times out
        continue-on-error: true   # surplus feed must never break the main daily scrape
        timeout-minutes: 30
        env:
          DEED_LOOKBACK_DAYS: "35"

      - name: Surplus dashboard (auto-calculated)
        run: python scraper/surplus_dashboard.py
        if: always()
        continue-on-error: true
        timeout-minutes: 5

      - name: Commit results
        if: always()              # commit whatever data was produced, even on a partial run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "leads $(date -u '+%Y-%m-%d')"
          git pull --rebase -X theirs origin main   # data files: this run's output wins the race
          git push

  deploy:
    needs: scrape
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/
      - id: deployment
        uses: actions/deploy-pages@v4
